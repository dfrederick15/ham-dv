[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hamdv"
version = "0.1.0"
description = "Live video and audio over an amateur radio FM voice channel (works through voice repeaters)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
radio = ["sounddevice>=0.4", "pyserial>=3.5"]
camera = ["opencv-python-headless>=4.8"]
all = ["sounddevice>=0.4", "pyserial>=3.5", "opencv-python-headless>=4.8", "pillow>=9"]

[project.scripts]
hamdv = "hamdv.cli:main"

[tool.setuptools]
packages = ["hamdv"]
